[workspace]
resolver = "2"
members = [
    "crates/kuro-api",
    "crates/kuro-patch",
    "crates/kuro-core",
    "crates/kuro-tui",
]
# The vendored third-party crate is a path dependency of kuro-patch, not a
# workspace member — keep its test suite out of `cargo test` at the root.
exclude = ["vendor/hdiffpatch-rs"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/vedaru/kuro"

# Smaller release binaries (strip symbols; behavior unchanged).
[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
[workspace.dependencies]
kuro-api = { path = "crates/kuro-api" }
kuro-patch = { path = "crates/kuro-patch" }
kuro-core = { path = "crates/kuro-core" }
