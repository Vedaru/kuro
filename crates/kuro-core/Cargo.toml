[package]
name = "kuro-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Kuro game manager: download, verify, apply, sync, server switch"

[dependencies]
# Only `StreamExt` is needed; the `futures` facade would also drag in
# executor/channel/io/macro/sink that nothing here uses.
futures-util = "0.3.31"
kuro-api.workspace = true
kuro-patch.workspace = true
md5 = "0.8.1"
rayon = "1.12.0"
# `zstd`/`brotli` are deliberately absent: the CDN serves already-compressed
# game files and JSON, and the client chooses the wire encodings it advertises
# (`Accept-Encoding`), so dropping them sheds the zstd-sys/brotli C libraries
# without changing what any download receives.
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "stream", "gzip"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "fs", "io-util", "time", "sync"] }

[dev-dependencies]
serde_json = "1"
