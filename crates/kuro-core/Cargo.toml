[package]
name = "kuro-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Kuro game manager: download, verify, apply, sync, server switch"

[dependencies]
futures = "0.3.34"
kuro-api.workspace = true
kuro-patch.workspace = true
md5 = "0.8.1"
rayon = "1.12.0"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "stream", "gzip", "zstd", "brotli"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "fs", "io-util", "time", "sync"] }
