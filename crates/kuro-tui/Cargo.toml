[package]
name = "kuro-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ratatui terminal UI for kuro"

[[bin]]
name = "kuro"
path = "src/main.rs"

[dependencies]
crossterm = "0.29.0"
kuro-core.workspace = true
ratatui = "0.30.2"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }
