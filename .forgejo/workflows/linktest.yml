# Throwaway probe: does a generic-package upload performed inside a workflow
# run in THIS repo get linked to this repo? Delete after reading the result.
name: linktest-probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          set -euo pipefail
          printf 'probe\n' > "$RUNNER_TEMP/probe.txt"
          code=$(curl -4 -sS -o /dev/null -w '%{http_code}' -m 60 -X PUT \
            -H "Authorization: token $FORGEJO_TOKEN" \
            --data-binary @"$RUNNER_TEMP/probe.txt" \
            "https://git.vedaru.cn/api/packages/Vedaru/generic/kuro-linktest/1.0/probe.txt")
          echo "upload HTTP $code"
