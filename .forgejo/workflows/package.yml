# Republish the `kuro` vendored component as a snapshot of this machine.
#
# This job builds nothing and installs nothing. It uploads whatever
# `kuro` is on this runner right now: publish.sh's selector for it
# reads `~/.local/bin/kuro`. "Rebuild" below means "re-tar the live file(s)", not
# "install".
#
# It lives in the kuro repo, not in the chezmoi repo that owns publish.sh,
# because a push here is exactly the signal "this tool's code changed". The
# chezmoi repo is fetched below only to supply publish.sh and MANIFEST.md;
# nothing from it goes into the bundle.
#
# A push here does NOT update the installed copy. Refreshing it (build,
# `cargo install`, ...) stays a deliberate local act; this job only observes
# the result. Same split as the nvim repackage job in the chezmoi repo.
#
# runs-on: ubuntu-latest is this laptop's own runner -- see
# ~/.local/share/forgejo-runner, label `ubuntu-latest:host`, host backend. It
# runs on the host rather than in a container, and that is load-bearing:
# publish.sh packages files under the runner's own $HOME.
#
# There is deliberately no actions/checkout step. The default action source is
# github.com -- the one host this setup exists to avoid -- so the fetch below
# clones over git, with the same per-command credential helper and IPv4 pin
# bootstrap.sh uses.

name: Republish kuro package

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the chezmoi repo (publish.sh and MANIFEST.md only)
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          set -euo pipefail
          # Cloudflare completes TCP on its IPv6 addresses and then drops the
          # TLS ClientHello, and libcurl does not retry the next address after a
          # TLS failure. http.curloptResolve (git >= 2.46) pins the name to one
          # IPv4 address, with SNI and the certificate still valid.
          ip=$(getent ahostsv4 git.vedaru.cn | awk 'NR==1 {print $1}')
          helper='!f() { echo "username=x"; printf "password=%s\n" "$FORGEJO_TOKEN"; }; f'
          rm -rf "$RUNNER_TEMP/chezmoi-src"
          git -c credential.helper= -c "credential.helper=$helper" \
              -c "http.curloptResolve=git.vedaru.cn:443:$ip" \
              clone --quiet --depth 1 \
              https://git.vedaru.cn/Vedaru/chezmoi.git "$RUNNER_TEMP/chezmoi-src"

      - name: Rebuild and republish the kuro package
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          OUT_DIR: ${{ runner.temp }}/vendored-build
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/chezmoi-src/ansible/vendored"
          # Guard: the per-tool split has to be on chezmoi main before this job
          # can work. Until then publish.sh answers "unknown component" and
          # fails the run, which would read as breakage rather than "not landed
          # yet". Skip green instead, and say why.
          if ! grep -q 'select_kuro()' publish.sh; then
            echo "chezmoi main does not yet define select_kuro(); the per-tool"
            echo "split has not landed. Nothing to publish -- re-run after it does."
            exit 0
          fi
          bash publish.sh kuro --replace

      - name: Keep only the current and pinned kuro versions
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          OUT_DIR: ${{ runner.temp }}/vendored-build
        run: |
          set -euo pipefail
          count=0
          for f in "$OUT_DIR"/kuro-*/kuro-*.tar.zst; do
            [ -e "$f" ] || continue
            count=$((count + 1))
            tarball="$f"
          done
          # 0 means the publish step skipped because the component is not in
          # chezmoi yet; there is nothing to prune and that is not an error.
          if [ "$count" -eq 0 ]; then
            echo "no kuro tarball was published; nothing to prune"
            exit 0
          fi
          if [ "$count" -ne 1 ]; then
            echo "expected 1 published kuro tarball under $OUT_DIR, found $count" >&2
            exit 1
          fi
          built=$(basename "$tarball" .tar.zst)
          built=${built#kuro-}

          # The version a restore will ask for, read from the fetched
          # group_vars so a drift between it and $built is visible in the log.
          pinned=$(python3 - "$RUNNER_TEMP/chezmoi-src/ansible/group_vars/all.yml" <<'PY'
          import sys, yaml
          comps = yaml.safe_load(open(sys.argv[1]))["vendored_components"]
          print(next(c["version"] for c in comps if c["name"] == "kuro"))
          PY
          )
          if [ -z "$pinned" ]; then
            echo "could not read the pinned kuro version from group_vars/all.yml" >&2
            exit 1
          fi
          echo "published $built; restore pin says $pinned"

          listing="$RUNNER_TEMP/kuro-packages.json"
          curl -4 -fsSL -H "Authorization: token $FORGEJO_TOKEN" \
               "https://git.vedaru.cn/api/v1/packages/Vedaru?type=generic&q=kuro&limit=50" \
               > "$listing"
          versions=$(python3 - "$listing" <<'PY'
          import json, sys
          for p in json.load(open(sys.argv[1])):
              if p["name"] == "kuro":
                  print(p["version"])
          PY
          )
          kept=0
          for v in $versions; do
            if [ "$v" = "$built" ] || [ "$v" = "$pinned" ]; then
              echo "  keep   kuro $v"
              kept=$((kept + 1))
            else
              code=$(curl -4 -sS -o /dev/null -w '%{http_code}' -X DELETE \
                     -H "Authorization: token $FORGEJO_TOKEN" \
                     "https://git.vedaru.cn/api/v1/packages/Vedaru/generic/kuro/$v")
              echo "  delete kuro $v -> HTTP $code"
            fi
          done
          if [ "$kept" -eq 0 ]; then
            echo "no version matched the keep set; registry listing looks wrong" >&2
            exit 1
          fi
