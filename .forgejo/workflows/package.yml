# Build and publish the `kuro` vendored component from this repo's source.
#
# A push to master builds kuro here and republishes it to the Forgejo generic
# registry as the per-tool bundle the ansible restore reads. This replaces the
# workflow that used to re-tar whatever `kuro` was already installed on the
# runner -- a snapshot of a machine, not a build.
#
# runs-on: glibc names a LABEL, and the label names an image. The Forgejo
# SERVER's runner carries it, mapped to a glibc image:
#
#   runner:
#     labels:
#       - "glibc:docker://ubuntu:26.04"
#
# so this job gets a throwaway ubuntu:26.04 container of its own, on the server.
# That runner also sets `container.network: host`, which is the only reason the
# loopback URLs below resolve: the instance listens on the host's 127.0.0.1:3000
# and the job container shares the host's network namespace.
#
# A per-job `container:` block does NOT work on this runner -- it ignores it and
# the job dies at container setup. The image must come from the runner's own
# label, and the workflow only asks for the label. Vedaru/Hyprland's hyprbuntu
# job is the same shape; its header carries the long version of this, including
# why an Alpine image cannot be used for a glibc binary.
#
# Nothing from the host is mounted. The runner permits exactly one host path as
# a job volume (/home/vedaru/Downloads, from `valid_volumes`) and this job uses
# none of it: the toolchain is installed inside the container by the first step,
# and the only files that leave are the ones uploaded to the registry.
#
# This replaces the `vedaru-host` runner: a forgejo-runner daemon under a
# systemd user unit on the server, with the HOST backend, which ran these steps
# as vedaru directly on the machine. It was retired on 2026-09-20 so that the
# only way any job on this instance executes is inside a container. The history
# is laptop runner (to 2026-09-17) -> server host runner (retired) -> this.
#
# Two things about the old setup are worth keeping in mind, because they are
# what this file no longer relies on:
#
#   * the build used to need the server's ~/.cargo (cargo 1.98.1) and the
#     publish step used to read $HOME/.local/bin/kuro -- staging the binary
#     there was simultaneously the install on the server and the bundle input.
#     Nothing is installed anywhere now.
#   * the label was disjoint from `ubuntu-latest` on purpose, because two
#     runners claimed that one and a job could land on the wrong host. There is
#     no second runner any more, so `glibc` is now only a name for the image.
#
# HOME is set to /home/vedaru below, and that needs its own explanation,
# because it is the one place a reader would reasonably assume a host
# dependency survived. It does not. publish.sh selects the file to bundle by
# expanding $HOME (select_kuro() reads "$HOME/.local/bin/kuro") and the
# published MANIFEST.tsv records the path it selected; the tarball is built with
# `cd / && tar ... -T list`, so that path becomes the archive member. A restore
# extracts it with `tar -C /`. /home/vedaru therefore has to be the path the
# bundle CLAIMS, whatever container the bundle is built in -- so the job creates
# a synthetic /home/vedaru and stages into it. The chown to 1000:1000 on the
# staged file is the same idea: the MANIFEST records owner:group, and 1000:1000
# is what vedaru is on the machines that restore it.
#
# Consequence of the move: a push no longer refreshes a copy of kuro on the
# server as a side effect. The server's ~/.local/bin/kuro now comes from the
# next ansible restore, like every other machine's.
#
# Everything talks to the instance over loopback (127.0.0.1:3000), not
# https://git.vedaru.cn. The public name resolves through Cloudflare, which
# completes TCP on its IPv6 addresses and then drops the TLS ClientHello, and
# which has answered 502/524 on the large PUTs publish.sh makes; the clone and
# every upload used to carry a credential helper plus an http.curloptResolve
# IPv4 pin to survive that. Same host, so the loopback hop is shorter and is the
# only path that never leaves the machine. The credential helper itself stays:
# the job still authenticates rather than relying on anonymous read.
#
# There is deliberately no actions/checkout step. The default action source is
# github.com -- the one host this setup exists to avoid -- so the fetches below
# clone over git from the local instance.
#
# Nothing is version-pinned: kuro's bundle version is the flat 1.0, replaced on
# every publish (--replace), so the per-tool SHA256SUMS is the integrity anchor
# rather than a version number.

name: Build and publish kuro package

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  # Not this container's home -- see the header. This is the path the published
  # bundle has to claim, recreated inside the job.
  HOME: /home/vedaru

jobs:
  package:
    runs-on: glibc
    steps:
      - name: Install the build toolchain
        # The job container is a bare ubuntu:26.04, so everything the build and
        # publish.sh need is installed here rather than assumed from a host.
        # rustup is pinned to the 1.98.1 that built the bundle being replaced:
        # a toolchain bump should be a deliberate act with a green run behind
        # it, not whatever the release channel served that morning.
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -y
          apt-get install -y --no-install-recommends \
              build-essential ca-certificates curl git pkg-config \
              python3 python3-yaml binutils zstd xz-utils file
          # rustup writes into $HOME (which is the synthetic /home/vedaru), so
          # it has to exist before it runs.
          install -d -m 0755 "$HOME"
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal \
              --default-toolchain 1.98.1 --no-modify-path
          "$HOME/.cargo/bin/cargo" --version

      - name: Fetch the chezmoi repo (publish.sh and MANIFEST.md only)
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          set -euo pipefail
          helper='!f() { echo "username=x"; printf "password=%s\n" "$FORGEJO_TOKEN"; }; f'
          rm -rf "$RUNNER_TEMP/chezmoi-src"
          git -c credential.helper= -c "credential.helper=$helper" \
              clone --quiet --depth 1 \
              http://127.0.0.1:3000/Vedaru/chezmoi.git "$RUNNER_TEMP/chezmoi-src"

      - name: Build kuro from source and stage it
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          set -euo pipefail
          [ "$HOME" = /home/vedaru ] || {
            echo "HOME is $HOME, expected the synthetic /home/vedaru" >&2
            echo "select_kuro() reads \$HOME/.local/bin, and the bundle records that path." >&2
            exit 1
          }
          # The toolchain was installed into $HOME/.cargo by the first step.
          export PATH="$HOME/.cargo/bin:$PATH"
          command -v cargo >/dev/null || { echo "cargo not on PATH" >&2; exit 1; }
          helper='!f() { echo "username=x"; printf "password=%s\n" "$FORGEJO_TOKEN"; }; f'
          src="$RUNNER_TEMP/kuro-src"
          rm -rf "$src"
          git -c credential.helper= -c "credential.helper=$helper" \
              clone --quiet --depth 1 \
              http://127.0.0.1:3000/Vedaru/kuro.git "$src"
          echo "building kuro at $(git -C "$src" rev-parse --short HEAD)"
          # Not --locked: the committed Cargo.lock is honored anyway, and a lock
          # that has drifted from Cargo.toml should not be the thing that
          # reddens the publish.
          (cd "$src" && cargo build --release)

          bin="$src/target/release/kuro"
          [ -x "$bin" ] || { echo "build produced no $bin" >&2; exit 1; }
          echo "built kuro ($(stat -c '%s' "$bin") bytes)"

          # Exactly what select_kuro() reads, at the mode and ownership the
          # published bundle records (775, 1000:1000). The steps run as root in
          # the job container, so the ids are set explicitly -- nothing on a
          # restore target has a root-owned ~/.local/bin.
          install -Dm775 -o 1000 -g 1000 "$bin" "$HOME/.local/bin/kuro"

      - name: Publish the kuro package
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          FORGEJO_URL: http://127.0.0.1:3000
          OUT_DIR: ${{ runner.temp }}/vendored-build
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/chezmoi-src/ansible/vendored"
          bash publish.sh kuro --replace

      - name: Keep only the current and pinned kuro versions
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          OUT_DIR: ${{ runner.temp }}/vendored-build
        run: |
          set -euo pipefail
          count=0
          for f in "$OUT_DIR"/kuro-*/kuro-*.tar.zst; do
            [ -e "$f" ] || continue
            count=$((count + 1))
            tarball="$f"
          done
          if [ "$count" -ne 1 ]; then
            echo "expected 1 published kuro tarball under $OUT_DIR, found $count" >&2
            exit 1
          fi
          built=$(basename "$tarball" .tar.zst)
          built=${built#kuro-}

          # The version a restore will ask for, read from the fetched
          # group_vars so a drift between it and $built is visible in the log.
          pinned=$(python3 - "$RUNNER_TEMP/chezmoi-src/ansible/group_vars/all.yml" <<'PY'
          import sys, yaml
          comps = yaml.safe_load(open(sys.argv[1]))["vendored_components"]
          print(next(c["version"] for c in comps if c["name"] == "kuro"))
          PY
          )
          if [ -z "$pinned" ]; then
            echo "could not read the pinned kuro version from group_vars/all.yml" >&2
            exit 1
          fi
          echo "published $built; restore pin says $pinned"

          listing="$RUNNER_TEMP/kuro-packages.json"
          curl -fsSL -H "Authorization: token $FORGEJO_TOKEN" \
               "http://127.0.0.1:3000/api/v1/packages/Vedaru?type=generic&q=kuro&limit=50" \
               > "$listing"
          versions=$(python3 - "$listing" <<'PY'
          import json, sys
          for p in json.load(open(sys.argv[1])):
              if p["name"] == "kuro":
                  print(p["version"])
          PY
          )
          kept=0
          for v in $versions; do
            if [ "$v" = "$built" ] || [ "$v" = "$pinned" ]; then
              echo "  keep   kuro $v"
              kept=$((kept + 1))
            else
              code=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
                     -H "Authorization: token $FORGEJO_TOKEN" \
                     "http://127.0.0.1:3000/api/v1/packages/Vedaru/generic/kuro/$v")
              echo "  delete kuro $v -> HTTP $code"
            fi
          done
          if [ "$kept" -eq 0 ]; then
            echo "no version matched the keep set; registry listing looks wrong" >&2
            exit 1
          fi
